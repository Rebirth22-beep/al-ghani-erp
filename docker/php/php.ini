; ============================================================
; PHP runtime overrides for Al-Ghani ERP (mounted into the PHP container)
; Tuned for ERP workload: large form posts, PDF generation, occasional imports.
; ============================================================

; Error reporting — local DEV. Production overrides via APP_ENV in compose.
display_errors = Off
log_errors = On

; Sane defaults for ERP forms (sale-invoice with many lines, PDF print)
memory_limit = 256M
post_max_size = 32M
upload_max_filesize = 32M
max_input_vars = 5000
max_execution_time = 60

; Timezone — match the business's locale
date.timezone = Asia/Karachi

; OPcache for speed
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
