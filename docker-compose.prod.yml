version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      args:
        APP_ENV: production
    container_name: alghani_app
    restart: always
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - mysql
      - redis
    networks:
      - alghani_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: alghani_frontend_dist
    restart: always
    networks:
      - alghani_net

  nginx:
    image: nginx:1.25-alpine
    container_name: alghani_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
      - frontend
    networks:
      - alghani_net

  mysql:
    image: mysql:8.0
    container_name: alghani_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alghani_net

  redis:
    image: redis:7-alpine
    container_name: alghani_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - alghani_net

volumes:
  mysql_data:
  redis_data:

networks:
  alghani_net:
    driver: bridge
